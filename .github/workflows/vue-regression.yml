name: Vue Directive Regression

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  event-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Compile isolated regression
        run: cargo test -p oak-vue --test event_shell --no-run --message-format=json > regression-build.json
      - name: Run isolated regression with resource bounds
        shell: bash
        run: |
          set -euo pipefail
          binary="$(python3 -c 'import json; print(next(item["executable"] for line in open("regression-build.json") if (item := json.loads(line)).get("reason") == "compiler-artifact" and item.get("executable") and item["target"]["name"] == "event_shell"))')"
          ulimit -v 524288
          timeout 30s "$binary" event_shell --nocapture
