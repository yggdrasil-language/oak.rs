name: Check Rust

on:
    push:
        branches: [master, dev]
    pull_request:
        branches: [master, dev]

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    rust-check:
        name: Rust Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@nightly
              with:
                  components: rustfmt, clippy

            - name: Cache cargo registry
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Check TypeScript formatter build
              run: cargo check --manifest-path examples/oak-typescript/Cargo.toml --all-targets

            - name: Check compilation
              shell: bash
              run: |
                  set -euo pipefail
                  example_packages=()
                  while IFS= read -r package; do
                      example_packages+=("$package")
                  done < <(
                      cargo metadata --no-deps --format-version 1 \
                        | jq -r '.packages[] | select(.manifest_path | contains("/examples/")) | .name'
                  )
                  args=()
                  for package in "${example_packages[@]}"; do
                      args+=(--exclude "$package")
                  done
                  cargo check --workspace --all-targets --all-features "${args[@]}"

    rust-test:
        name: Rust Test (${{ matrix.os }}, ${{ matrix.feature }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                feature: [no-default, default, all]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@nightly

            - name: Cache cargo registry
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            # `--lib --tests` skips included-readme doctests (stale API snippets).
            - name: Run tests (no-default features)
              if: matrix.feature == 'no-default'
              shell: bash
              run: |
                  set -euo pipefail
                  packages=()
                  while IFS= read -r package; do packages+=("$package"); done < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.manifest_path | contains("/examples/")) | .name')
                  excludes=()
                  for package in "${packages[@]}"; do excludes+=(--exclude "$package"); done
                  cargo test --workspace --lib --tests --no-default-features --no-fail-fast "${excludes[@]}"

            - name: Run tests (default features)
              if: matrix.feature == 'default'
              shell: bash
              run: |
                  set -euo pipefail
                  packages=()
                  while IFS= read -r package; do packages+=("$package"); done < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.manifest_path | contains("/examples/")) | .name')
                  excludes=()
                  for package in "${packages[@]}"; do excludes+=(--exclude "$package"); done
                  cargo test --workspace --lib --tests --no-fail-fast "${excludes[@]}"

            - name: Run tests (all features)
              if: matrix.feature == 'all'
              shell: bash
              run: |
                  set -euo pipefail
                  packages=()
                  while IFS= read -r package; do packages+=("$package"); done < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.manifest_path | contains("/examples/")) | .name')
                  excludes=()
                  for package in "${packages[@]}"; do excludes+=(--exclude "$package"); done
                  cargo test --workspace --lib --tests --all-features --no-fail-fast "${excludes[@]}"
