name: Check Rust

on:
    push:
        branches: [master, dev]
    pull_request:
        branches: [master, dev]

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    rust-check:
        name: Rust Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@nightly
              with:
                  components: rustfmt

            - name: Cache cargo registry
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  # `Cargo.lock` is deliberately not committed, so it cannot key
                  # this cache: `hashFiles` would return an empty string and every
                  # run would restore one frozen entry while saving nothing new
                  # after the first. Manifests and the toolchain file are the only
                  # resolution inputs that exist here, so this key tracks those.
                  # It cannot see a dependency resolving to a different revision
                  # inside the same semver range, and the comment says so on
                  # purpose. The `cargo-manifests-` namespace keeps the old
                  # constant `cargo-` entries from matching this prefix.
                  key: ${{ runner.os }}-cargo-manifests-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-manifests-

            # default-members = projects/*; examples are checked explicitly below.
            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Check projects
              run: cargo check --all-targets --all-features

            - name: Check oak-typescript
              run: cargo check --manifest-path examples/oak-typescript/Cargo.toml --all-targets

            - name: Test downstream language frontends
              run: |
                  cargo test -p oak-valkyrie --lib --tests
                  cargo test -p oak-html --test from_red --test parser
                  cargo test -p oak-typescript --test decode_string_literal

    rust-test:
        name: Rust Test (${{ matrix.os }}, ${{ matrix.feature }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                feature: [no-default, default, all]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@nightly

            - name: Cache cargo registry
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  # `Cargo.lock` is deliberately not committed, so it cannot key
                  # this cache: `hashFiles` would return an empty string and every
                  # run would restore one frozen entry while saving nothing new
                  # after the first. Manifests and the toolchain file are the only
                  # resolution inputs that exist here, so this key tracks those.
                  # It cannot see a dependency resolving to a different revision
                  # inside the same semver range, and the comment says so on
                  # purpose. The `cargo-manifests-` namespace keeps the old
                  # constant `cargo-` entries from matching this prefix.
                  key: ${{ runner.os }}-cargo-manifests-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-manifests-

            # `--lib --tests` skips included-readme doctests (stale API snippets).
            - name: Run tests (no feature)
              if: matrix.feature == 'no-default'
              run: cargo test --lib --tests --no-default-features --no-fail-fast

            - name: Run tests (default features)
              if: matrix.feature == 'default'
              run: cargo test --lib --tests --no-fail-fast

            - name: Run tests (all features)
              if: matrix.feature == 'all'
              run: cargo test --lib --tests --all-features --no-fail-fast
