[package]
name = "oak-stylus"
description = "Stylus language support for Oak framework"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
oak-core = { workspace = true }
triomphe = { workspace = true }
serde = { workspace = true, optional = true }
oak-lsp = { workspace = true, optional = true }
oak-hover = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "net"] }
oak-highlight = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
oak-mcp = { workspace = true, optional = true }
oak-pretty-print = { workspace = true, optional = true }

[dev-dependencies]
oak-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "oak-core/serde"]
lsp = ["dep:oak-lsp", "dep:oak-hover", "dep:oak-highlight", "dep:futures", "dep:oak-pretty-print"]
mcp = ["lsp", "dep:tokio", "dep:oak-mcp"]
oak-highlight = ["dep:oak-highlight"]
oak-pretty-print = ["dep:oak-pretty-print"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
