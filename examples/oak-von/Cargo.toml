[package]
name = "oak-von"
version.workspace = true
authors.workspace = true
description = "Valkyrie language parser with support for modern Valkyrie syntax and features."
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/yggdrasil-language/oak.rs/tree/master/examples/oak-von"
documentation = "https://docs.rs/oak-von"
categories = ["parsing"]
keywords = ["parser", "valkyrie", "language"]

[dependencies]
oak-core = { workspace = true }
oak-formatter = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
oak-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "oak-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]

[[test]]
name = "formatter"
path = "tests/formatter/mod.rs"
required-features = ["serde"]
