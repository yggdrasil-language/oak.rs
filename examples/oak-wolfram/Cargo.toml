[package]
name = "oak-wolfram"
version.workspace = true
authors.workspace = true
description = "Wolfram Language parser with support for Mathematica syntax and symbolic computation."
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/yggdrasil-language/oak.rs/tree/master/examples/oak-wolfram"
documentation = "https://docs.rs/oak-wolfram"
categories = ["parsing"]
keywords = ["parser", "wolfram", "mathematica", "symbolic"]

[dependencies]
oak-core = { workspace = true }
serde = { workspace = true, optional = true }
oak-lsp = { workspace = true, optional = true }
oak-hover = { workspace = true, optional = true }
oak-vfs = { workspace = true, optional = true }
oak-highlight = { workspace = true, optional = true }
oak-pretty-print = { workspace = true, optional = true }
oak-mcp = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["full"] }

[dev-dependencies]
oak-testing = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "oak-core/serde"]
lsp = ["dep:oak-lsp", "dep:oak-hover", "dep:oak-vfs", "oak-highlight", "oak-pretty-print", "dep:futures"]
mcp = ["lsp", "oak-mcp/io-std", "dep:tokio"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
