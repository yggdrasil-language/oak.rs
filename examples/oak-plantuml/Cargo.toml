[package]
name = "oak-plantuml"
version.workspace = true
authors.workspace = true
description = "PlantUML class and sequence diagram parser for Oak"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/yggdrasil-language/oak.rs/tree/master/examples/oak-plantuml"

[dependencies]
oak-core = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
oak-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "oak-core/serde"]

[[test]]
name = "main"
required-features = ["serde"]
