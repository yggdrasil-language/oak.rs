[package]
name = "oak-dejavu"
version.workspace = true
authors.workspace = true
description = "High-performance incremental Dejavu parser for the oak ecosystem with flexible configuration."
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/yggdrasil-language/oak.rs/tree/master/examples/oak-dejavu"
documentation = "https://docs.rs/oak-dejavu"
categories = ["parsing"]
keywords = ["parser", "dejavu", "experimental"]

[dependencies]
oak-core = { workspace = true }
oak-macros = { workspace = true }
oak-highlight = { workspace = true, optional = true }
oak-pretty-print = { workspace = true, optional = true }
oak-lsp = { workspace = true, optional = true }
oak-hover = { workspace = true, optional = true }
oak-vfs = { workspace = true, optional = true }
oak-mcp = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
arcstr.workspace = true
indexmap.workspace = true
im-rc.workspace = true
num.workspace = true
bigdecimal.workspace = true
unicode-ident.workspace = true

[dev-dependencies]
oak-testing = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "oak-core/serde"]
lsp = ["dep:oak-lsp", "dep:oak-hover", "dep:oak-vfs", "oak-highlight", "oak-pretty-print", "dep:futures"]
mcp = ["lsp", "oak-mcp/io-std"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
