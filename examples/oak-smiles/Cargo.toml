[package]
name = "oak-smiles"
version.workspace = true
authors.workspace = true
description = "SMILES and reaction-SMILES parser for the oak ecosystem."
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/yggdrasil-language/oak.rs/tree/master/examples/oak-smiles"
categories = ["parsing"]
keywords = ["parser", "smiles", "cheminformatics", "molecule"]

[dependencies]
oak-core = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "oak-core/serde"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
required-features = ["serde"]
