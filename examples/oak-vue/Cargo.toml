[package]
name = "oak-vue"
version.workspace = true
authors.workspace = true
description = "High-performance incremental Vue SFC parser for the oak ecosystem."
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/yggdrasil-language/oak.rs/tree/master/examples/oak-vue"
categories = ["parsing"]
keywords = ["parser", "vue", "sfc", "incremental"]

[dependencies]
oak-core = { workspace = true }
serde = { workspace = true, optional = true }
oak-lsp = { workspace = true, optional = true }
oak-hover = { workspace = true, optional = true }
oak-vfs = { workspace = true, optional = true }
oak-highlight = { workspace = true, optional = true }
oak-mcp = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "oak-core/serde"]
lsp = ["dep:oak-lsp", "dep:oak-hover", "dep:oak-vfs", "oak-highlight", "dep:futures"]
mcp = ["lsp", "oak-mcp/io-std"]

[[test]]
name = "main"
required-features = ["serde"]
