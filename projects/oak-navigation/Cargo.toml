[package]
name = "oak-navigation"
version.workspace = true
authors.workspace = true
description = "Symbol navigation, definition lookup, and reference tracking for the Oak framework."
edition.workspace = true
license.workspace = true
repository = "https://github.com/yggdrasil-language/oak.rs/tree/master/projects/oak-navigation"
categories = ["development-tools"]
keywords = ["navigation", "goto-definition", "references"]

[dependencies]
oak-core = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde", "oak-core/serde"]
