[package]
name = "oak-semantic-search"
version.workspace = true
authors.workspace = true
description = "Fuzzy semantic search and code indexing for the Oak framework."
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/yggdrasil-language/oak.rs/tree/master/projects/oak-semantic-search"
categories = ["development-tools"]
keywords = ["search", "semantic", "fuzzy", "indexing"]

[dependencies]
oak-core = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
serde = { workspace = true, optional = true }
# oak-json = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde", "oak-core/serde"]
