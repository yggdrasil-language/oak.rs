[package]
name = "oak-core"
version.workspace = true
authors.workspace = true
description = "Core parser combinator library providing fundamental parsing primitives."
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/yggdrasil-language/oak.rs/tree/master/projects/oak-core"
documentation = "https://docs.rs/oak-core"
categories = ["parsing", "no-std"]
keywords = ["parser", "parser-combinators", "core", "primitive"]

[dependencies]
serde = { workspace = true, optional = true }
triomphe = { workspace = true }
smallvec = { workspace = true }
twox-hash.workspace = true
diagnostic = { workspace = true, optional = true, default-features = false, features = ["std", "serde"] }
logger = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
logger = { workspace = true }
serial_test = { workspace = true }

[features]
default = []
serde = ["dep:serde"]
diagnostic = ["dep:diagnostic", "serde"]
logger = ["diagnostic", "diagnostic/logger", "dep:logger"]

[[test]]
name = "diagnostic_unified"
required-features = ["diagnostic"]

[[test]]
name = "diagnostic_logger"
required-features = ["logger"]

[package.metadata.docs.rs]
all-features = true
