[workspace]
resolver = "3"
members = [
    "projects/*",
    "examples/*",
]
default-members = [
    "projects/*",
]
exclude = [
    "projects/.DS_Store",
]

[workspace.package]
version = "0.0.12"
authors = ["Yggdrasill Team <192607617@qq.com>"]
edition = "2024"
license = "MPL-2.0"
homepage = "https://github.com/yggdrasil-language/oak.rs"
repository = "https://github.com/yggdrasil-language/oak.rs"

[workspace.dependencies]
# External dependencies removed to achieve architectural independence
walkdir = { version = "2.5.0" }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.149" }
schemars = { version = "1.2.1", features = ["derive"] }
logger = { git = "https://github.com/oovm/rust-boost", branch = "dev" }
serial_test = { version = "3.2.0" }
unicode-ident = { version = "1.0.24" }
url = { version = "2.5.8", features = ["serde"] }
triomphe = { version = "0.1.15", default-features = false, features = ["serde"] }
smallvec = { version = "1.15", features = ["union", "const_generics", "const_new"] }
proc-macro2 = { version = "1.0.106" }
quote = { version = "1.0.45" }
syn = { version = "2.0.117", features = ["full"] }
tokio = { version = "1.50.0", default-features = false }
futures = { version = "0.3.32" }
dashmap = { version = "6.1.0" }
lazy_static = "1.5.0"
anyhow = "1.0.102"
thiserror = "2.0.18"
itertools = "0.14.0"
chrono = "0.4.44"
notify = "8.2.0"
crossterm = "0.29.0"
unicode-width = "0.2.2"
clap = { version = "4.5.60", features = ["derive"] }
axum = "0.8.8"
arcstr = { version = "1.2.0", features = ["serde"] }
indexmap = { version = "2.13.0", features = ["serde"] }
im-rc = "15.1.0"
num = "0.4.3"
bigdecimal = "0.4.10"
ordered-float = "5.1.0"
twox-hash = "2.1.2"
regex = "1.12"
base64 = "0.22.0"
diagnostic = { git = "https://github.com/oovm/rust-boost", branch = "dev", package = "diagnostic", default-features = false, features = ["std", "serde"] }

# Internal project dependencies
oak-core = { path = "projects/oak-core", version = "0.0.12" }
oak-macros = { path = "projects/oak-macros", version = "0.0.12" }
oak-vfs = { path = "projects/oak-vfs", version = "0.0.12" }
oak-symbols = { path = "projects/oak-symbols", version = "0.0.12" }
oak-resolver = { path = "projects/oak-resolver", version = "0.0.12" }
oak-highlight = { path = "projects/oak-highlight", version = "0.0.12" }
oak-pretty-print = { path = "projects/oak-pretty-print", version = "0.0.12" }
oak-formatter = { path = "projects/oak-formatter", version = "0.0.12" }
oak-lsp = { path = "projects/oak-lsp", version = "0.0.12" }
oak-folding = { path = "projects/oak-folding", version = "0.0.12" }
oak-hover = { path = "projects/oak-hover", version = "0.0.12" }
oak-navigation = { path = "projects/oak-navigation", version = "0.0.12" }
oak-repl = { path = "projects/oak-repl", version = "0.0.12" }
oak-semantic-tokens = { path = "projects/oak-semantic-tokens", version = "0.0.12" }
oak-structural-view = { path = "projects/oak-structural-view", version = "0.0.12" }
oak-semantic-search = { path = "projects/oak-semantic-search", version = "0.0.12" }
oak-visualize = { path = "projects/oak-visualize", version = "0.0.12" }
oak-testing = { path = "projects/oak-testing", version = "0.0.12" }
oak-mcp = { path = "projects/oak-mcp", version = "0.0.12" }
oak-source-map = { path = "projects/oak-source-map", version = "0.0.12" }
oaks = { path = "projects/oaks", version = "0.0.12" }

