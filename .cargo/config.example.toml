# Copy to `config.toml` (gitignored) and replace `<your-path>` with your local absolute path.
# Committed `Cargo.toml` pins rust-boost via git `rev`, not `Cargo.lock`.

[registries.crates-io]
protocol = "sparse"

[patch."https://github.com/oovm/rust-boost"]
boost-diagnostic = { path = "<your-path>/rust-boost/projects/boost-diagnostic" }
boost-log = { path = "<your-path>/rust-boost/projects/boost-log" }
boost-fs = { path = "<your-path>/rust-boost/projects/boost-fs" }
boost-source = { path = "<your-path>/rust-boost/projects/boost-source" }
boost-terminal = { path = "<your-path>/rust-boost/projects/boost-terminal" }
boost-console = { path = "<your-path>/rust-boost/projects/boost-console" }
boost-random = { path = "<your-path>/rust-boost/projects/boost-random" }
